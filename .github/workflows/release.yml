name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: .exe
            archive: zip
          - goos: windows
            goarch: arm64
            ext: .exe
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          OUT_DIR="dist"
          BIN_DIR="jirax_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "${OUT_DIR}/${BIN_DIR}"
          BIN_NAME="jirax${EXT}"
          go build -ldflags="-s -w -X main.version=${VERSION}" -o "${OUT_DIR}/${BIN_DIR}/${BIN_NAME}" ./cmd/jirax
          cp README.md "${OUT_DIR}/${BIN_DIR}/README.md"
          cp SPEC.md "${OUT_DIR}/${BIN_DIR}/SPEC.md"
          if [ "${ARCHIVE}" = "zip" ]; then
            (cd "${OUT_DIR}" && zip -r "${BIN_DIR}.zip" "${BIN_DIR}")
          else
            tar -C "${OUT_DIR}" -czf "${OUT_DIR}/${BIN_DIR}.tar.gz" "${BIN_DIR}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jirax-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
